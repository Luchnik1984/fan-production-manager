version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fan-production-db
    environment:
      POSTGRES_DB: fanproduction
      POSTGRES_USER: fanuser
      POSTGRES_PASSWORD: fanpassword
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: