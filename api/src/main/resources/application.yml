# ============================================
# API SERVER CONFIGURATION
# ============================================

server:
 port: ${API_PORT:8080}

spring:
  devtools:
    restart:
      enabled: true


  # ============================================
  # DATASOURCE CONFIGURATION
  # ============================================
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:fanproduction}
    username: ${DB_USERNAME:fanuser}
    password: ${DB_PASSWORD:fanpassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10

  # ============================================
  # JPA / HIBERNATE CONFIGURATION
  # ============================================
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL:validate}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${FORMAT_SQL:true}
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # ============================================
  # FLYWAY SETTINGS (database migrations)
  # ============================================
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    validate-on-migrate: true
    clean-disabled: true
    placeholder-replacement: false
# ============================================
# LOGGING SETTINGS
# ============================================

logging:
  level:
    com.fanproduction: ${LOG_LEVEL:DEBUG}
    org.springframework.web: INFO
    org.flywaydb: ${LOG_LEVEL:DEBUG}
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:DEBUG}
    org.hibernate.type.descriptor.sql: TRACE
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
  file:
    name: ${LOG_DIR:logs}/api.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

# ============================================
# JWT SETTINGS
# ============================================
  jwt:
    secret: ${JWT_SECRET:mySecretKeyForJWTTokenGeneration12345678901234567890}
    expiration: ${JWT_EXPIRATION:86400000}